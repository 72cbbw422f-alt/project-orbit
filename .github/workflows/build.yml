name: Build Regnvakt iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Regnvakt app
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS device
        run: |
          xcodebuild \
            -project VADER.xcodeproj \
            -scheme VADER \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Regnvakt.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VÄDRA.app"
          fi
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VADER.app"
          fi
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry VADER-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Regnvakt-unsigned-IPA
          path: build/ipa/VADER-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
