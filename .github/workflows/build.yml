name: Build Regnvakt iOS

on:
  push:
    branches: [main, feature/frost-notification-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Regnvakt app
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen librsvg

      - name: Render verified Regnvakt app icon
        run: |
          rsvg-convert -w 1024 -h 1024 VADER/Assets.xcassets/AppIcon.appiconset/AppIcon.svg -o VADER/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          sips -g pixelWidth -g pixelHeight VADER/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select available iPhone simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime_devices in data.get("devices", {}).values()
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed on this runner")
          print(devices[0]["udid"])
          ')"
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $DEVICE_ID"

      - name: Run frost risk unit tests
        run: |
          xcodebuild \
            -project VADER.xcodeproj \
            -scheme VADERTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build for iOS device
        run: |
          xcodebuild \
            -project VADER.xcodeproj \
            -scheme VADER \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Regnvakt.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VÄDRA.app"
          fi
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VADER.app"
          fi
          test -d "$APP_PATH"
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          plist_path = Path(sys.argv[1])
          if not plist_path.is_file():
              raise SystemExit(f"Built app Info.plist is missing: {plist_path}")
          with plist_path.open("rb") as plist_file:
              info = plistlib.load(plist_file)

          expected_identifier = "app.walnut8211.vadra.weather-refresh"
          identifiers = info.get("BGTaskSchedulerPermittedIdentifiers", [])
          background_modes = info.get("UIBackgroundModes", [])
          if expected_identifier not in identifiers:
              raise SystemExit(f"Missing BGTaskScheduler identifier: {expected_identifier}")
          if "fetch" not in background_modes:
              raise SystemExit("Built app is missing UIBackgroundModes: fetch")
          if info.get("CFBundleIdentifier") != "app.walnut8211.vadra":
              raise SystemExit(f"Unexpected bundle identifier: {info.get('CFBundleIdentifier')}")

          print("Validated built Info.plist: bundle ID, BGTaskScheduler identifier and fetch background mode")
          PY
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry VADER-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Regnvakt-unsigned-IPA
          path: build/ipa/VADER-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
