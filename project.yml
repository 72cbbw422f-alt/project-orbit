name: VADER
options:
  bundleIdPrefix: com.vader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Regnvakt
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: VÄDER använder din position för att visa lokalt väder.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  VADER:
    type: application
    platform: iOS
    sources:
      - path: VADER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.walnut8211.vadra
        PRODUCT_NAME: Regnvakt
        EXECUTABLE_NAME: VADRA
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
